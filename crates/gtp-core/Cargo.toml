[package]
name = "gtp-core"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Derives specta::Type on the types that cross the IPC boundary (enabled by the Tauri shell).
specta = ["dep:specta"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", optional = true, features = ["derive"] }
ulid = "1"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
