# cargo-deny policy (spec section 9, convention section 10). Run: cargo deny check
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive licences only. Extend deliberately in a PR that explains the new dependency.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9
# The workspace has no third-party dependencies yet; do not warn about unused allowances.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are `publish = false` and carry no public licence.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
