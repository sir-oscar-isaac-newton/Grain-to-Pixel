[package]
name = "gtp-app"
description = "Application layer: use-case services, jobs and the render pipeline (ADR 0005)"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Derives specta::Type on the types that cross the IPC boundary (enabled by the Tauri shell).
specta = ["dep:specta", "gtp-core/specta", "gtp-ingest/specta"]

[dependencies]
gtp-catalog = { version = "0.0.0", path = "../gtp-catalog" }
gtp-core = { version = "0.0.0", path = "../gtp-core" }
gtp-edit = { version = "0.0.0", path = "../gtp-edit" }
gtp-ingest = { version = "0.0.0", path = "../gtp-ingest" }
gtp-io = { version = "0.0.0", path = "../gtp-io" }
gtp-negative = { version = "0.0.0", path = "../gtp-negative" }
fast_image_resize = "6.1.0"
# Free space on the library's drive without unsafe platform calls.
fs4 = "1.1.0"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", optional = true, features = ["derive"] }
# The diagnostics zip: deflate through flate2 only, none of the other codecs or encryption.
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2"] }
# Background work (thumbnail regeneration) logs what it could not do; the shell sets up the subscriber.
tracing = "0.1"

[dev-dependencies]
gtp-core = { version = "0.0.0", path = "../gtp-core", features = ["testing"] }
gtp-ingest = { version = "0.0.0", path = "../gtp-ingest", features = ["testing"] }
criterion = "0.8.2"

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
