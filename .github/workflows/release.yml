name: Release

# A tag vX.Y.Z (or vX.Y.Z-rc.N for a dry run) runs the same gates as ci.yml, builds the installers
# with updater signatures and creates a DRAFT GitHub Release holding them and latest.json, which the
# app's updater reads. Nothing is published: the author reviews the draft and publishes it by hand.
# The steps to follow are in docs/release.md.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tag, the app version and the updater key must be right before anything is built.
  check:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Tag, app version and updater key agree
        run: node tools/scripts/check-bundle/check-bundle.mjs release "$GITHUB_REF_NAME"

  gates:
    name: gates
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish (${{ matrix.os }})
    needs: gates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # tether is off on Windows.
            args: --bundles nsis --config src-tauri/tauri.release.conf.json
          - os: macos-15
            args: --bundles app,dmg --features tether --config src-tauri/tauri.release.conf.json
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
        shell: bash

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Builds, signs the updater packages, uploads the installers and merges this platform into
      # latest.json. The release stays a draft; a tag with a hyphen (v0.1.0-rc.1) is a prerelease.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Grain to Pixel ${{ github.ref_name }}
          releaseBody: See the assets below. Install steps for the unsigned builds are in docs/install.md.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true
