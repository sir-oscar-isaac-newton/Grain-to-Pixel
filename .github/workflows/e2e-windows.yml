name: e2e-windows

# WebDriver test of the real window (tauri-driver + msedgedriver). Not a merge gate: on GitHub-hosted
# runners WebView2 ignores the flags msedgedriver passes (the runner session is elevated), so the
# session cannot start there. It works on a normal desktop session (`pnpm test:e2e`); see the
# follow-up issue about making it run on CI. Run it by hand or weekly to catch drift.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Restore tauri-driver
        id: tauri-driver-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-2.1.0-${{ runner.os }}

      - name: Install tauri-driver
        id: tauri-driver-install
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked --version 2.1.0

      - name: Save tauri-driver
        if: steps.tauri-driver-install.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-2.1.0-${{ runner.os }}

      - name: Install the msedgedriver that matches WebView2
        shell: pwsh
        run: ./tools/scripts/e2e/install-edgedriver.ps1

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app (release binary, no installer)
        run: pnpm build:app

      - name: End-to-end test
        run: pnpm test:e2e
