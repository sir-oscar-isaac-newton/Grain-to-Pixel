[package]
name = "grain-to-pixel-desktop"
description = "Grain to Pixel desktop shell (Tauri adapter over gtp-app)"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "grain_to_pixel_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gtp-app = { path = "../../../crates/gtp-app", version = "0.0.0" }
gtp-core ={ path = "../../../crates/gtp-core", version = "0.0.0", features = ["specta"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# tauri-specta stack is still pre-release: pin exact versions (see docs/architecture.md).
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
serde_json = "1"
# Mock runtime, to check that job events reach the webview layer (src/sink.rs tests).
tauri = { version = "2", features = ["test"] }

[lints]
workspace = true
