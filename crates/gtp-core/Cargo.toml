[package]
name = "gtp-core"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Derives specta::Type on the types that cross the IPC boundary (enabled by the Tauri shell).
specta = ["dep:specta"]
# Deterministic synthetic negatives with ground truth, for tests. Off in every app build; the crate
# turns it on for its own tests through the dev-dependency below.
testing = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", optional = true, features = ["derive"] }
ulid = "1"

[dev-dependencies]
gtp-core = { path = ".", version = "0.0.0", features = ["testing"] }
proptest = "1"

[lints]
workspace = true
