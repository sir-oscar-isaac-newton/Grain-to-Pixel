# cargo-deny policy (spec section 9, convention section 10). Run: cargo deny check
[graph]
# Only the platforms we ship (spec section 1.1); skips Linux-only crates in the Tauri tree.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # `paste` (a compile-time proc-macro helper) is unmaintained, with no vulnerability and no safe
  # upgrade. It is pulled in by `specta`, which powers the typed IPC (tauri-specta, issue D-02).
  # Approved by the owner on 2026-10-29. Remove this entry when specta moves to `pastey` or
  # drops the dependency; re-check on every tauri-specta/specta update.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro dependency of specta; no vulnerability" },
]

[licenses]
# Permissive licences only. Extend deliberately in a PR that explains the new dependency.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9
# The workspace has no third-party dependencies yet; do not warn about unused allowances.
unused-allowed-license = "allow"

# jpeg-encoder (P-04) is MIT OR Apache-2.0, plus the IJG licence for code derived from libjpeg.
# IJG is permissive; its one condition (credit the Independent JPEG Group in the documentation of
# shipped binaries) is met in docs/third-party-notices.md. Allowed for this crate only.
[[licenses.exceptions]]
crate = "jpeg-encoder"
allow = ["IJG"]

[licenses.private]
# Workspace crates are `publish = false` and carry no public licence.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
