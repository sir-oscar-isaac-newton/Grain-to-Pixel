name: Release

# A tag vX.Y.Z (or vX.Y.Z-rc.N for a dry run) runs the same gates as ci.yml, builds the installers
# with updater signatures and creates a DRAFT GitHub Release holding them and latest.json, which the
# app's updater reads. Nothing is published: the author reviews the draft and publishes it by hand.
# The steps to follow are in docs/release.md.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tag, the app version and the updater key must be right before anything is built.
  check:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Tag, app version and updater key agree
        run: node tools/scripts/check-bundle/check-bundle.mjs release "$GITHUB_REF_NAME"

  gates:
    name: gates
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish (${{ matrix.os }})
    needs: gates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # tether is off on Windows.
            args: --bundles nsis --config src-tauri/tauri.release.conf.json
          - os: macos-15
            args: --bundles app,dmg --features tether --config src-tauri/tauri.release.conf.json
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
        shell: bash

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The macOS build has the tether feature, which links libgphoto2; the build copies the libraries
      # into the app (H-09, tools/scripts/release/bundle-libgphoto2.sh).
      - name: Install libgphoto2 (macOS)
        if: runner.os == 'macOS'
        run: brew install libgphoto2 pkgconf

      # Builds, signs the updater packages, uploads the installers and merges this platform into
      # latest.json. The release stays a draft; a tag with a hyphen (v0.1.0-rc.1) is a prerelease.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Grain to Pixel ${{ github.ref_name }}
          releaseBody: See the assets below. Install steps for the unsigned builds are in docs/install.md.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true

      - name: Check the libraries in the app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(target/release/bundle/macos/*.app)
          if [ ${#apps[@]} -ne 1 ]; then echo "expected one app, found ${#apps[@]}"; exit 1; fi
          bash tools/scripts/release/bundle-libgphoto2.sh verify "${apps[0]}"

      # The LGPL-2.1 asks for the source of what the app contains. The gphoto2 and libgphoto2_sys
      # crates are compiled into the app, so they are offered as rawler is (job `source` below): the
      # pinned crate archives, checked against Cargo.lock. The libraries beside them are separate
      # dylibs: their archives (checked against Homebrew's checksums) and the list of libraries with
      # their licences go to the draft release too.
      - name: Attach the source of the bundled libraries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(node tools/scripts/release/gphoto-source.mjs "$RUNNER_TEMP/gphoto"; node tools/scripts/release/gphoto-crates-source.mjs "$RUNNER_TEMP/gphoto-crates")
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          for file in $files; do
            gh api --method POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$(basename "$file")" -H "Content-Type: application/octet-stream" --input "$file"
          done

  # The LGPL-2.1 asks for the source of the rawler version the app is linked with (Q-08, ADR 0007):
  # it is fetched from crates.io, checked against Cargo.lock and attached to the draft release.
  source:
    name: attach the rawler source
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Fetch the source archive of the pinned rawler
        id: archive
        run: echo "file=$(node tools/scripts/release/rawler-source.mjs "$RUNNER_TEMP/rawler")" >> "$GITHUB_OUTPUT"

      # A draft release is not found by its tag, so its id is looked up in the list of releases.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.archive.outputs.file }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          gh api --method POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$(basename "$FILE")" -H "Content-Type: application/octet-stream" --input "$FILE"
