name: Bundle

# Builds the installers (NSIS on Windows, dmg on macOS arm64) and uploads them as artifacts, so they can be
# installed by hand. Runs when the bundle settings or the app crate's manifest change, and on every push to
# develop. The Windows installer must stay within 40 MB; the dmg size is only reported.
on:
  pull_request:
    paths:
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/tauri.macos.conf.json
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/icons/**
      - tools/scripts/release/**
      - .github/workflows/bundle.yml
      - tools/scripts/check-bundle/**
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            # tether is off on Windows.
            features: ''
            glob: target/release/bundle/nsis/*.exe
            enforce: '--enforce'
          - os: macos-15
            bundles: app,dmg
            features: '--features tether'
            glob: target/release/bundle/dmg/*.dmg
            enforce: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Installer settings
        run: pnpm check:bundle

      # The dmg is built with the tether feature, which links libgphoto2 (H-09); the build then copies
      # the libraries into the app (tauri.macos.conf.json, tools/scripts/release/bundle-libgphoto2.sh).
      - name: Install libgphoto2 (macOS)
        if: runner.os == 'macOS'
        run: brew install libgphoto2 pkgconf

      - name: Build the installer
        run: pnpm --filter @gtp/desktop exec tauri build --bundles ${{ matrix.bundles }} ${{ matrix.features }}

      - name: Libraries in the app (macOS)
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          apps=(target/release/bundle/macos/*.app)
          if [ ${#apps[@]} -ne 1 ]; then echo "expected one app, found ${#apps[@]}"; exit 1; fi
          bash tools/scripts/release/bundle-libgphoto2.sh verify "${apps[0]}"

      - name: Installer size
        run: |
          shopt -s nullglob
          files=(${{ matrix.glob }})
          if [ ${#files[@]} -ne 1 ]; then echo "expected one installer, found ${#files[@]}"; exit 1; fi
          node tools/scripts/check-bundle/check-bundle.mjs size "${files[0]}" ${{ matrix.enforce }}

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14
