[package]
name = "gtp-app"
description = "Application layer: use-case services, jobs and the render pipeline (ADR 0005)"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
gtp-core = { version = "0.0.0", path = "../gtp-core" }
gtp-edit = { version = "0.0.0", path = "../gtp-edit" }
gtp-negative = { version = "0.0.0", path = "../gtp-negative" }
fast_image_resize = "6.1.0"
rayon = "1.12.0"

[dev-dependencies]
gtp-core = { version = "0.0.0", path = "../gtp-core", features = ["testing"] }
criterion = "0.8.2"

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
