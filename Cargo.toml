[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri", "tools/benchmark"]
exclude = ["tools/scripts/check-deps/tests/fixtures", "tools/spikes/nef-probe"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "LicenseRef-Private"

# Convention section 1: no unsafe, no panicking shortcuts, no printing, in committed code.
# Tests are exempt through clippy.toml. Every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# SQLite is C code compiled by its build script. Build it optimized even in debug and test builds,
# so the search timing tests (spec section 11, at most 100 ms over 50,000 frames) measure something
# close to the shipped app instead of an unoptimized database.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
