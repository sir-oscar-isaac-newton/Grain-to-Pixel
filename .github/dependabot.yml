version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The tauri-specta stack is pre-release and pinned to one compatible set;
      # upgrade the three together by hand (see packages/README.md).
      - dependency-name: specta
      - dependency-name: specta-typescript
      - dependency-name: tauri-specta

  - package-ecosystem: npm # also covers the pnpm workspace
    directories:
      - /
      - /apps/desktop
      - /packages/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Held back on purpose until the Node baseline moves past 20.12 / plugin support catches up.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
