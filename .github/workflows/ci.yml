name: CI

# Gates 1-6 of docs/workflow.md section 8 on Windows and macOS (arm64) in job `ci`;
# gate 7 in jobs `smoke-macos` (launch test) and `e2e-windows` (WebDriver test); gate 8 lives in pr-title.yml.
on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # rust-toolchain.toml pins the version and components; install it before the cache key is computed.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo deny
        run: cargo deny check --hide-inclusion-graph

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Tool tests (check-deps, check-ipc)
        run: pnpm test:tools

      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod

      - name: Crate dependency rules
        run: pnpm check:deps

      - name: IPC bindings are up to date
        run: pnpm check:ipc

  # Gate 7a: the built app starts and renders its page on macOS (Tauri has no WebDriver for WebKit).
  smoke-macos:
    name: smoke-macos
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app (release binary, no installer)
        run: pnpm build:app

      - name: Smoke test (launch and wait for ready)
        run: pnpm smoke

  # Gate 7b: drive the real window with WebDriver on Windows (title, backend version over IPC, view switch).
  e2e-windows:
    name: e2e-windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-2.1.0-${{ runner.os }}

      - name: Install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked --version 2.1.0

      - name: Install the msedgedriver that matches WebView2
        shell: pwsh
        run: ./tools/scripts/e2e/install-edgedriver.ps1

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app (release binary, no installer)
        run: pnpm build:app

      - name: End-to-end test
        run: pnpm test:e2e
